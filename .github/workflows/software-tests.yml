name: Desktop software tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: agent/desktop/package-lock.json
      - run: npm ci
      - run: npm test
